services:
  cleaner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bale-chat-cleaner
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DB_PATH=/app/data/cleaner.db
      - PYTHONUNBUFFERED=1
